[project]
name = "task-compass"
version = "0.1.0"
description = "Define tasks precisely, estimate them honestly, learn from the gap."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "anthropic>=0.70",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["task_compass*"]

[tool.setuptools.package-data]
task_compass = ["llm/prompts/*.md", "web/templates/**/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
