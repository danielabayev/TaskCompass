<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ ui.app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='vendor/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>{{ ui.app_name }}</strong></li></ul>
      <ul>
        <li><a href="{{ url_for('web.home') }}">{{ ui.nav_home }}</a></li>
        <li><a href="{{ url_for('web.history') }}">{{ ui.nav_history }}</a></li>
        <li><a href="{{ url_for('web.spend') }}">{{ ui.nav_spend }}</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
